services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-bhs
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  stable-diffusion:
    image: ghcr.io/ai-dock/stable-diffusion-webui:latest
    container_name: stable-diffusion
    ports:
      - "7860:7860"
    environment:
      - WEBUI_ARGS=--api --xformers --medvram
    volumes:
      - sd_data:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: black-hole-backend
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - ollama
      - stable-diffusion
    volumes:
      - ./web2.html:/web2.html:ro
      - ./libs:/libs:ro
      - db_data:/app/data
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - SD_HOST=http://stable-diffusion:7860
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: unless-stopped

  celery-worker:
    build: ./backend
    container_name: celery-worker
    depends_on:
      - redis
      - ollama
      - stable-diffusion
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - SD_HOST=http://stable-diffusion:7860
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    command: celery -A tasks worker --loglevel=info --concurrency=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_data:
  sd_data:
  db_data:
